services:

  # ── 1. Ollama model server ──────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - classification
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── 2. One-time model pull ────────────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - classification
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b"]
    restart: "no"

  # ── 3. FastAPI classification service ─────────────────────────────────────────
  app:
    image: amirmokhtarian/classification-welodge:latest
    container_name: classification-api
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - API_BEARER_TOKEN=${API_BEARER_TOKEN}
      - PREDICT_CACHE_SIZE=512
    ports:
      - "80:8003"
    networks:
      - classification
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  classification:
    driver: bridge

volumes:
  ollama_data:
